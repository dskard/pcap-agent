[project]
name = "pcap-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.97.0",
    "chatlas>=0.16.0",
    "click>=8.3.3",
    "duckdb>=1.5.2",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "opentelemetry-instrumentation-logging>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "polars>=1.40.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scapy>=2.7.0",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[project.scripts]
pcap-agent = "pcap_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcap_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
